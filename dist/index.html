<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Worlds Frvr</title>
    <script type="module" crossorigin src="/assets/index-Bx64d6RQ.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DoqrYT5e.css">
  </head>
  <body>
    <div id="stage">
      <div id="hud">
        <div class="brand">Worlds Frvr</div>
        <div id="help">WASD move · Shift sprint · Space jump · F vehicle · J punch · 1-4 emotes · Esc pause</div>
        <div id="status">On foot</div>
      </div>
      <div id="prompt"></div>
      <div id="emote-label"></div>
      <button type="button" id="btn-gear" aria-label="Settings">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="8" fill="none" stroke="#102033" stroke-width="4"/>
          <path fill="#102033" d="M28 6h8l2 8 6 3 7-5 6 6-5 7 3 6 8 2v8l-8 2-3 6 5 7-6 6-7-5-6 3-2 8h-8l-2-8-6-3-7 5-6-6 5-7-3-6-8-2v-8l8-2 3-6-5-7 6-6 7 5 6-3z"/>
        </svg>
      </button>
      <div id="touch">
        <div id="joystick" aria-label="Move"><div id="knob"></div></div>
          <button type="button" id="btn-punch" class="action" aria-label="Punch">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <path fill="#e7b089" d="M18 30c0-3 2-6 6-6 1 0 2 .4 3 1V18c0-3 2-5 5-5s5 2 5 5v8h1V16c0-3 2-5 5-5s5 2 5 5v12h1V20c0-3 2-5 5-5s5 2 5 5v16c0 10-8 18-18 18H28C20 54 14 46 14 38V32c0-1 2-2 4-2z"/>
              <path fill="#c4845a" d="M22 28c2 0 3 2 3 4v8h-6v-6c0-3 1-6 3-6z"/>
            </svg>
          </button>
          <button type="button" id="btn-emote" class="action" aria-label="Emote">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <circle cx="32" cy="32" r="22" fill="#ffd15c"/>
              <circle cx="24" cy="28" r="3" fill="#2a2118"/>
              <circle cx="40" cy="28" r="3" fill="#2a2118"/>
              <path d="M22 38c3 6 17 6 20 0" fill="none" stroke="#2a2118" stroke-width="3" stroke-linecap="round"/>
            </svg>
          </button>
          <button type="button" id="btn-vehicle" class="action" aria-label="Vehicle">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <path fill="#1c1c1c" d="M10 36l6-12c1-2 3-4 6-4h20c3 0 5 2 6 4l6 12v10H10V36z"/>
              <path fill="#9fd4ff" d="M24 24h16l4 8H20l4-8z"/>
              <circle cx="20" cy="46" r="6" fill="#2a2a2a"/>
              <circle cx="44" cy="46" r="6" fill="#2a2a2a"/>
              <circle cx="20" cy="46" r="2.5" fill="#d0d0d0"/>
              <circle cx="44" cy="46" r="2.5" fill="#d0d0d0"/>
            </svg>
          </button>

        <button type="button" id="btn-context" class="hidden" data-kind="getin">
          <svg class="ctx-car" viewBox="0 0 64 64" aria-hidden="true">
            <path fill="#1c1c1c" d="M8 36l7-13c1-2 3-4 6-4h22c3 0 5 2 6 4l7 13v12H8V36z"/>
            <path fill="#9fd4ff" d="M22 23h20l4 9H18l4-9z"/>
            <circle cx="18" cy="48" r="5" fill="#2a2a2a"/>
            <circle cx="46" cy="48" r="5" fill="#2a2a2a"/>
          </svg>
          <svg class="ctx-door" viewBox="0 0 64 64" aria-hidden="true">
            <path fill="#6b4a30" d="M16 8h28v48H16z"/>
            <circle cx="38" cy="34" r="3" fill="#e6d3a4"/>
          </svg>
          <span id="ctx-label">Get In</span>
        </button>
      </div>
      <section id="title-screen" class="menu">
        <h1>Worlds Frvr</h1>
        <p>A neighborhood you can walk.</p>
        <button type="button" id="btn-start">START</button>
        <button type="button" id="btn-open-settings">SETTINGS</button>
      </section>
      <section id="settings-screen" class="menu hidden">
        <h2>Settings</h2>
        <label>Music volume <input id="set-music" type="range" min="0" max="100" value="35" /></label>
        <label>SFX volume <input id="set-sfx" type="range" min="0" max="100" value="80" /></label>
        <label>Camera distance <input id="set-cam" type="range" min="4" max="12" step="0.1" value="4.6" /></label>
        <label class="check"><input id="set-shadows" type="checkbox" checked /> Shadows</label>
        <p class="hint">Drag the fist, smiley, and car anywhere on the screen, then Save.</p>
        <button type="button" id="btn-layout-save">Save</button>
        <button type="button" id="btn-settings-back">Back</button>
      </section>
      <section id="pause-screen" class="menu hidden">
        <p class="brand-pause">Worlds Frvr</p>
        <h2>Paused</h2>
        <button type="button" id="btn-resume">Resume</button>
        <button type="button" id="btn-pause-settings">Settings</button>
        <button type="button" id="btn-main-menu">Main Menu</button>
      </section>
    </div>
  </body>
</html>
